[project]
name = "visual-research"
version = "0.1.0"
description = "A small native-Manim explainer skill and nonvisual utilities"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av>=15,<19",
    "imageio-ffmpeg>=0.6,<0.7",
    "manim>=0.19.0,<0.20",
    "Pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
