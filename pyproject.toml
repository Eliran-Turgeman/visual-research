[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-research"
version = "0.1.0"
description = "Reusable guidance and Manim primitives for narrated technical explainers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "manim>=0.19.0,<0.20",
]

[project.optional-dependencies]
voiceover-gtts = [
    "manim-voiceover[gtts]>=0.3.7,<0.4",
    "setuptools>=75,<81",
]
voiceover-openai = [
    "manim-voiceover[openai]>=0.3.7,<0.4",
    "setuptools>=75,<81",
]
voiceover-azure = [
    "manim-voiceover[azure]>=0.3.7,<0.4",
    "setuptools>=75,<81",
]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["manim_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
