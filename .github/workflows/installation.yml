name: Native Manim

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.9"
          enable-cache: false
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential python3-dev libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest -q
      - run: git diff --exit-code -- pyproject.toml uv.lock
